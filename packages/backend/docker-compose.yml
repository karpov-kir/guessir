# The local Postgres for `npm run start:dev`
name: guessir

services:
  database:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: guessir
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
      POSTGRES_DB: guessir
    secrets:
      - database-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U guessir"]
      interval: 2s
    volumes:
      - database-data:/var/lib/postgresql/data

secrets:
  # The backend reads the same file, through DATABASE_PASSWORD_FILE in env/.env.development
  database-password:
    file: env/database-password.development

volumes:
  database-data:
