name: CI
on: [push]
jobs:
  install:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM prepare
        uses: kk-forge-engineering/gh-actions/npm-prepare@v1

  build:
    runs-on: ubuntu-22.04
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM prepare
        uses: kk-forge-engineering/gh-actions/npm-prepare@v1

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-22.04
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM prepare
        uses: kk-forge-engineering/gh-actions/npm-prepare@v1

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-22.04
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: NPM prepare
        uses: kk-forge-engineering/gh-actions/npm-prepare@v1

      - name: Initialize coverage cache
        uses: actions/cache@v6
        with:
          path: ./coverage
          key: ${{ runner.os }}-coverage-${{ github.sha }}

      - name: Test
        run: npm run test:ci

  analyze:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore coverage cache 
        uses: actions/cache@v6
        with:
          path: ./coverage
          key: ${{ runner.os }}-coverage-${{ github.sha }}

      - name: SonarQube scan
        uses: kk-forge-engineering/gh-actions/sonarqube-scan@v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
