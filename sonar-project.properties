sonar.projectKey=guessir

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.sources=apps/backend/src,apps/web/src,packages/game/src,packages/logger/src
# Unit tests sit beside the code and the other levels in tests/: index both as tests, or SonarQube
# drops their entries from the test execution report.
sonar.tests=apps/backend/src,apps/web/src,packages/game/src,packages/logger/src,apps/backend/tests,apps/web/tests
sonar.test.inclusions=**/*.test.*
sonar.exclusions=**/*.test.*
