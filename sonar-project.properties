sonar.projectKey=guessir

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.sources=apps/backend/src,apps/web/src,packages/game/src
# Tests sit beside the code: index them as tests, or SonarQube drops their entries from the test
# execution report.
sonar.tests=apps/backend/src,apps/web/src,packages/game/src
sonar.test.inclusions=**/*.test.*
sonar.exclusions=**/*.test.*

sonar.coverage.exclusions=**/migrations/**
