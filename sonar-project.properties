sonar.projectKey=guessir

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.sources=packages/backend/src,packages/shared/src,packages/web/src
# Tests sit beside the code: index them as tests, or SonarQube drops their entries from the test execution report.
sonar.tests=packages/backend/src,packages/shared/src,packages/web/src
sonar.test.inclusions=**/*.test.*
sonar.exclusions=**/*.test.*

sonar.coverage.exclusions=**/migrations/**
