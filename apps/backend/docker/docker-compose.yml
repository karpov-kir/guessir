# The local Postgres for `mise run backend:start:dev`
name: guessir

services:
  database:
    image: postgres:18
    ports:
      # A random host port, so several services run at once. mise reads it with `docker compose port`
      - "127.0.0.1::5432"
    environment:
      POSTGRES_USER: guessir
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets:
      - database-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U guessir"]
      interval: 2s
    volumes:
      # Each Postgres major keeps its data in its own volume, as the production stacks do. A new major then
      # gets a new volume, and the old major's volume stays as a way back.
      - database-18:/var/lib/postgresql

secrets:
  # The backend reads the same file, through DATABASE_PASSWORD_FILE in env/.env.development
  database-password:
    file: ../env/database-password.development

volumes:
  database-18:
