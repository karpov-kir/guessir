[tools]
node = "26"

[tasks."backend:version"]
description = "Print the backend's version from its package.json, which a release tags"
quiet = true
dir = "packages/backend"
run = "node -p \"require('./package.json').version\""

[tasks."web:version"]
description = "Print the web's version from its package.json, which a release tags"
quiet = true
dir = "packages/web"
run = "node -p \"require('./package.json').version\""

[tasks.setup]
description = "Install every dependency"
run = "npm ci"

[tasks.check]
description = "The gate before a commit: every linter, the build and every test"
depends = ["lint", "build", "test"]

[tasks."check:ci"]
description = "check with coverage and the SonarQube reports, as CI runs it"
depends = ["lint", "build", "test:ci"]

[tasks.lint]
run = "npm run lint"

[tasks.build]
run = "npm run build"

[tasks.test]
run = "npm test"

[tasks."test:ci"]
run = "npm run test:ci"
